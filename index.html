          <a href="#" className="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white text-ink text-sm font-medium hover:bg-gold hover:text-white transition-colors">
            Сайт «ЯрШоу» <IconChevron size={14} />
          </a>
        </div>
      </div>

      {/* Телефоны сотрудников */}
      <div className="mt-12">
        <h2 className="font-serif text-2xl font-bold text-ink mb-6">Телефоны сотрудников и подразделений</h2>
        <div className="bg-white rounded-2xl border border-gold/20 overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-milk-dark">
              <tr>
                <th className="text-left px-6 py-3 font-semibold text-ink">Должность</th>
                <th className="text-left px-6 py-3 font-semibold text-ink">ФИО</th>
                <th className="text-left px-6 py-3 font-semibold text-ink">Телефон</th>
              </tr>
            </thead>
            <tbody>
              {STAFF.map((s, i) => (
                <tr key={i} className="border-t border-gold/20 hover:bg-milk transition-colors">
                  <td className="px-6 py-3 text-ink-soft">{s.position}</td>
                  <td className="px-6 py-3 text-ink font-medium">{s.name}</td>
                  <td className="px-6 py-3 text-burgundy font-semibold">{s.phone}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
);

/* ==================== ГЛАВНОЕ ПРИЛОЖЕНИЕ ==================== */
const App = () => {
  const [currentPage, setCurrentPage] = useState("home");
  const [visionMode, setVisionMode] = useState("normal");

  useEffect(() => {
    document.body.className = "";
    if (visionMode === "large") document.body.classList.add("large-text");
    if (visionMode === "xlarge") document.body.classList.add("xlarge-text");
    if (visionMode === "contrast") document.body.classList.add("high-contrast");
    if (visionMode === "noimg") document.body.classList.add("no-images");
  }, [visionMode]);

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [currentPage]);

  const renderPage = () => {
    switch (currentPage) {
      case "home": return <HomePage setCurrentPage={setCurrentPage} />;
      case "about": return <AboutPage />;
      case "collectives": return <CollectivesPage />;
      case "afisha": return <AfishaPage />;
      case "services": return <ServicesPage />;
      case "official": return <OfficialPage />;
      case "contacts": return <ContactsPage />;
      default: return <HomePage setCurrentPage={setCurrentPage} />;
    }
  };

  return (
    <div className="min-h-screen bg-milk text-ink flex flex-col">
      <Header currentPage={currentPage} setCurrentPage={setCurrentPage} visionMode={visionMode} setVisionMode={setVisionMode} />
      <main className="flex-1">{renderPage()}</main>
      <Footer setCurrentPage={setCurrentPage} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
